- id: preset-standard
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-cordis
  disabled: true
- id: agent-preset-registry
  config:
    default: fieldkit
- insert:
    - id: fieldkit
      name: '@ehapower/dsh-fieldkit'
    - id: preset-fieldkit
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: fieldkit
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: false
              prefix: >-
                你是 EHA Fieldkit 助手，默认用中文。Fieldkit 是官方 eha-tool direct-api 的薄入口。
                需要当前工作台目标、最近一次原始结果或固定命令目录时，调用 fieldkit_context；用户已给出完整命令时可直接调用 fieldkit_command，完整保留 bodyText 和 queryText 原文。
                Fieldkit 返回的是 eha-tool 的 HTTP 状态和原始文本。忠实展示返回内容，不把 HTTP 成功推断为设备完成，也不替用户补充、重写或重发命令。
                当前对话的目标只用于显示和填写用户界面，不是授权、占用或锁。token 文件只由主机进程读取，不要求用户粘贴凭据。
                服务设置、启动、附着和退出由工作台按钮操作。服务不可用时说明 eha-tool 的返回错误；不自动启动或重试。
                离线配置检查使用 fieldkit_check_configuration。除设备交互外，保留 DSH 提供的标准能力。
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
